config_version: "1.0"
experiment:
  name: bo_bm25
  domain: Bo
harness: {type: simple_loop, max_steps: 4}
model: {provider: mock, name: deterministic-mock, backend: deterministic}
adapter:
  name: bo
  parameters:
    repo: ../bo
    corpus: sample_corpus/chunks.jsonl
parameters:
  retrieval:
    stage: bm25
    top_k: 3
    query_expansion: false
evaluation: {dataset: ../bo/sample_corpus/retrieval_gold.jsonl}
tracking: {type: local, uri: ./mlruns, experiment: Bo}
seed: 7
